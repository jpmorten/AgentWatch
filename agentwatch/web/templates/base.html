<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentWatch</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e3e6ec;--accent:#2f6fde;--warn:#b7791f;--bad:#c53030;--ok:#2f855a}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--muted:#99a1b3;--line:#2a313d;--accent:#6d9cff;--warn:#e0a84a;--bad:#f07070;--ok:#5fc48a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;gap:18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font-size:16px}header a{color:var(--fg);text-decoration:none}header a:hover{color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
a{color:var(--accent)}.muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.stat .n{font-size:22px;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);margin:1px 2px 1px 0}
.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:100%}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
button.secondary{background:transparent;color:var(--fg);border:1px solid var(--line)}button.danger{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.scroll{overflow-x:auto}
pre{white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<header>
  <b>🛰 AgentWatch</b>
  <a href="/">Enheder</a><a href="/new">+ Tilføj manuelt</a><a href="/changes">Ændringer</a>
  <span class="muted">Eksport:</span>
  <a href="/export/summary">summary</a><a href="/export/inventory">inventory</a><a href="/export/cyclonedx">CycloneDX</a>
  <span class="muted" style="margin-left:auto">Netværk: {{ cfg.networks|join(", ") }}</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
