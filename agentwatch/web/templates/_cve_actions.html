{% for st, label in [("acknowledged","kendt"),("ignored","ignorér"),("open","genåbn")] %}{% if f.status != st and not (st == "open" and f.status == "resolved") %}
<form method="post" action="/cve/status" style="display:inline"><input type="hidden" name="device_id" value="{{ f.device_id }}"><input type="hidden" name="cve_id" value="{{ f.cve_id }}"><input type="hidden" name="status" value="{{ st }}"><input type="hidden" name="back" value="{{ back_url|default('/cves?status=' ~ status) }}"><button class="secondary" style="padding:3px 8px;font-size:12px">{{ label }}</button></form>{% endif %}{% endfor %}{% if f.status == "resolved" %}<span class="pill ok">løst</span>{% endif %}
