{% extends "base.html" %}{% block body %}
<h1>Log</h1>
<div class="card">
  <p class="muted" style="margin-top:0">Seneste {{ lines|length }} linjer. Den fulde log (inkl. DEBUG og nmap-kommandoer) ligger i <span class="mono">{{ log_file }}</span>.</p>
  <div class="logbox" style="height:70vh">{% for l in lines %}<div>{{ l }}</div>{% else %}<div>Ingen log endnu.</div>{% endfor %}</div>
</div>
<script>const b=document.querySelector('.logbox');b.scrollTop=b.scrollHeight</script>
{% endblock %}
