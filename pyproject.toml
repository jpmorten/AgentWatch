[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwatch"
version = "0.1.0"
description = "Netværksinventar (devices, software, firmware, webapps, app-brug) til sårbarhedsvurdering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
  "typer>=0.12",
  "zeroconf>=0.130",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
agent = ["anthropic>=2.0"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]
all = ["anthropic>=2.0", "mcp>=2.0", "pytest>=8"]

[project.scripts]
agentwatch = "agentwatch.cli:app"

[tool.setuptools.packages.find]
include = ["agentwatch*"]

[tool.setuptools.package-data]
agentwatch = ["web/templates/*.html", "config_example.yaml"]
